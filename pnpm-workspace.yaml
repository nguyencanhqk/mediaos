packages:
  - "apps/*"
  - "packages/*"
  # apps/lms = LMS nhập tại chỗ, workspace RIÊNG (Next.js+SQLite, pnpm-lock riêng) — loại khỏi
  # workspace MediaOS để root install/turbo KHÔNG đụng tới (tránh xung đột deps + build).
  - "!apps/lms"
  # apps/fbpost = app vệ tinh SOCIAL (đăng bài Facebook Page). Cùng lý do như apps/lms nhưng nó dùng
  # NPM (package-lock.json) + Tailwind v4 + node:sqlite — trộn vào workspace pnpm là xung đột deps.
  # Hàng rào R3 của DECISIONS-08. Khác apps/lms: code fbpost NẰM TRONG git monorepo (SOCIAL-DEC-005).
  - "!apps/fbpost"

# Pin React TYPES về một phiên bản toàn monorepo — chặn @types/react dedupe skew
# (ReactNode/ReactPortal mismatch 19.0.14 vs 19.2.16). Khớp peerDeps packages/{ui,web-core}.
# Chỉ pin types (KHÔNG pin react/react-dom runtime).
overrides:
  "@types/react": "19.2.16"
  "@types/react-dom": "19.2.3"
  # S0-CI-2 dependency-scan: ép phiên bản ĐÃ VÁ cho dep transitive có advisory high-sev (pnpm audit gate).
  # Range-scoped (chỉ override dải lỗ hổng) — KHÔNG đụng major khác. ws/form-data transitive; multer cũng
  # tới gián tiếp qua @nestjs/platform-express nên direct bump apps/api chưa đủ → cần override.
  "ws@>=8.0.0 <8.21.0": "^8.21.0"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "multer@>=1.0.0 <2.2.0": "^2.2.0"
  # 2026-07-22 — vá advisory HIGH (cổng CI = `pnpm audit --audit-level high`). Cả 6 đều là dep BẮC CẦU
  # của tooling build/test (eslint · vitest · @nestjs/cli · drizzle-kit · exceljs), KHÔNG phải dep
  # runtime của API. Dùng override thay vì bump devDep gốc để giữ blast radius nhỏ: `pnpm audit
  # --fix=update` kéo theo TypeScript 5.7→5.9 + prettier + eslint + turbo — thay đổi toolchain lớn
  # không cần thiết cho một bản vá bảo mật.
  # ⚠️ Advisory moderate/low còn lại (esbuild · uuid · body-parser) CỐ Ý KHÔNG override: dưới ngưỡng
  # cổng, và bản pnpm đề xuất cho esbuild (0.24.3) CHƯA TỪNG phát hành ⇒ override làm GÃY install của
  # drizzle-kit (ERR_PNPM_NO_MATCHING_VERSION). Rà lại khi nâng drizzle-kit/vitest.
  # 2026-07-25 — advisory GHSA-mh99-v99m-4gvg (CVE-2026-14257) đã mở rộng phủ cả 5.0.7 → re-bump 5.x lên
  # ^5.0.8. GIỮ per-major cho 1.x/2.x: minimatch@3.1.5/@9 gọi `require('brace-expansion')()` như HÀM — chỉ
  # dòng 1.x/2.x giữ `module.exports = expand` ở entry `main` (5.0.8 chỉ có `exports.expand` ⇒ ép 5.0.8 vào
  # minimatch@3.x ⇒ "expand is not a function", VỠ eslint).
  #
  # ⚠️ 2026-07-29 — ĐÍNH CHÍNH ghi chú 07-25 ("1.1.16/2.1.2 ĐÃ CÓ guard ⇒ audit là FALSE-POSITIVE"): SAI.
  # ĐO THỰC NGHIỆM (`expand('{a,b}'.repeat(60))`, `node --max-old-space-size=1024`):
  #   1.1.16 → exit 134, FATAL V8 out-of-memory   ⇒ KHÔNG có guard
  #   2.1.2  → exit 134, FATAL V8 out-of-memory   ⇒ KHÔNG có guard
  #   2.1.3  → 66.666 kết quả / 3.999.960 ký tự (bị cắt tại EXPANSION_MAX_LENGTH) ⇒ CÓ guard
  #   5.0.8  → 66.666 kết quả / 3.999.960 ký tự                                   ⇒ CÓ guard
  # Lý do 1.1.16/2.1.2 lừa được người đọc: tarball CÓ ship `ADVISORY-CVE-2026-14257.md` + bản đã vá ở
  # `dist/commonjs/index.js`, nhưng `package.json` của chúng có `main: index.js` và KHÔNG có `exports` map
  # ⇒ `require('brace-expansion')` (đường mà minimatch@3/@5 đi) nạp `index.js` = code CŨ, chưa vá.
  # 2.1.3 (dist-tag `maintenance-v2`) mới đưa guard vào chính `index.js` ⇒ dùng nó cho CẢ 1.x lẫn 2.x.
  # Dòng 1.x KHÔNG có bản vá nào (1.1.16 là bản cuối) ⇒ redirect 1.x sang 2.1.3: cùng `module.exports =
  # expandTop`, chỉ khác bỏ dep `concat-map` + yêu cầu Node ≥10 (repo chạy Node ≥20).
  #
  # ⚠️ Bump này KHÔNG làm check Dependency-scan xanh: dải advisory là `<=5.0.7` nên nó cờ MỌI bản 1.x–4.x
  # kể cả bản đã vá. Muốn xanh phải hoặc suppress GHSA (owner 07-25 đã bác — "luôn vá, không ỉm"), hoặc
  # nâng eslint 9→10 (eslint@10 dùng minimatch@^10 ⇒ brace-expansion@5). Vá này chọn ĐÚNG CODE trước.
  "brace-expansion@<2.1.3": "^2.1.3"
  "brace-expansion@>=3.0.0 <5.0.8": "^5.0.8"
  "fast-uri@>=3.0.0 <=3.1.3": "^3.1.4"
  # 2026-08-07 — NỚI dải từ `<4.3.0` lên `<4.3.1`: advisory MỚI `GHSA-5p4m-2wfm-xmqj`
  # (CVE-2026-59870, quadratic CPU trong `!!omap`) phủ CẢ 4.3.0 mà override cũ vừa ép lên.
  # Đo 07/08: đỏ trên MỌI PR (đã tái hiện ở máy + trên CI của #361/#363), đường tới là
  # `eslint > @eslint/eslintrc > js-yaml` — dev-tooling, KHÔNG vào runtime bundle của API.
  "js-yaml@>=4.0.0 <4.3.1": "^4.3.1"
  "shell-quote@<=1.8.4": "^1.8.5"
  # 2026-08-08 — advisory MỚI `GHSA-2v37-7h3g-55p8` (HIGH, `nanoid <3.3.17`: custom generator lặp vô hạn
  # khi size = 0). Lên registry giữa lần Security chạy cuối trên master (07/08 15:42 XANH) và PR #368
  # (08/08 03:33 ĐỎ) ⇒ đỏ trên MỌI PR, KHÔNG do PR nào sinh ra. `pnpm why nanoid -r` đo 08/08: cây có
  # ĐÚNG MỘT bản 3.3.16, đường tới duy nhất là `postcss > vite`, mọi lá đều devDependencies (vitest ·
  # @vitejs/plugin-react · @tailwindcss/vite) — KHÔNG vào runtime bundle của API.
  "nanoid@<3.3.17": "^3.3.17"
  # 2026-07-25 — vá advisory HIGH postcss (GHSA source-map path traversal, <8.5.18). Transitive dev-dep
  # qua vitest coverage (apps/api>@vitest/coverage-v8>vitest>…>postcss), KHÔNG vào runtime bundle. Range-
  # scoped để chỉ nâng dải lỗ hổng, không đụng postcss khác. Cổng CI = `pnpm audit --audit-level high`.
  "postcss@<8.5.18": "^8.5.18"

# 2026-07-29 — GHSA-mh99-v99m-4gvg (brace-expansion DoS): dải advisory ghi `<=5.0.7`, tức nó cờ MỌI bản
# của dòng 1.x–4.x kể cả bản ĐÃ VÁ (2.1.3). `overrides` bên trên đã đưa toàn cây về 2.1.3 + 5.0.8 và ĐO
# THỰC NGHIỆM xác nhận cả hai đều có guard độ dài ở entry `main` ⇒ phần audit còn báo là dương-tính-giả.
# ⚠️ Ignore này KHÔNG được đứng một mình: `scripts/check-brace-expansion-guard.mjs` chạy CÙNG job trong
# security.yml, CHẠY THẬT expand() trên đúng file mà require() nạp và ĐỎ nếu có bản chưa vá lọt vào cây —
# kể cả ca hiểm là bản "đã vá theo số hiệu" nhưng entry `main` vẫn là code cũ (đúng ca 1.1.16/2.1.2).
# Gỡ ignore này khi thượng nguồn sửa dải advisory, hoặc khi cây hết sạch brace-expansion <5.
auditConfig:
  ignoreGhsas:
    - GHSA-mh99-v99m-4gvg

# Cho phép chạy postinstall của các gói cần binary native (pnpm 10+ chặn mặc định).
allowBuilds:
  esbuild: true
  "@swc/core": true
  "@nestjs/core": true
  # S2-FND-CONTRACT-1: @scarf/scarf kéo theo qua @nestjs/swagger→swagger-ui-dist. Chỉ là analytics
  # install-ping (KHÔNG cần build native) → false = KHÔNG chạy postinstall + tắt gate ERR_PNPM_IGNORED_BUILDS.
  "@scarf/scarf": false

# Repo đặt minimumReleaseAge (chặn cài gói vừa phát hành — phòng supply-chain). Bản VÁ bảo mật ở
# `overrides` bên trên phải được miễn trừ ở đây, nếu không install sẽ từ chối chính bản đã vá.
minimumReleaseAgeExclude:
  - brace-expansion@2.1.3
  - brace-expansion@5.0.8
  - fast-uri@3.1.4
  - js-yaml@4.3.1
  - nanoid@3.3.17
  - nanoid@3.3.18
  - shell-quote@1.8.5
