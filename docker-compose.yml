# MediaOS — hạ tầng dev local (CLAUDE.md §4 · ADR-0003/0011/0013/0014).
# Dùng: `cp .env.example .env` rồi `docker compose up -d`.
# KHÔNG commit `.env` (đã gitignore). Mọi giá trị nhạy cảm chỉ ở `.env`.
#
# Service: postgres (RLS sẽ bật ở G2) · pgbouncer (transaction-mode cho set_config tenant)
#          · valkey (cache/queue/presence) · minio (object storage S3-compatible, artifact nhỏ).

name: mediaos

services:
  postgres:
    image: postgres:17-alpine
    container_name: mediaos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mediaos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-mediaos}
      # UTC-at-rest (ADR-0008): container chạy UTC, app quy đổi TZ.
      TZ: UTC
      PGTZ: UTC
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
    ports:
      # S6-SEC-ROTATE-1 (KI-043): BIND LOOPBACK. Trước 2026-07-28 dạng "PORT:5432" bind 0.0.0.0 ⇒ cụm
      # Postgres (kể cả PROD trên máy này) nghe MỌI interface, trong khi mật khẩu superuser lại là literal
      # nằm trong repo PUBLIC. Hai lỗi đó cộng lại = truy cập PROD từ xa. Cần mở ra ngoài thì đổi ở .env
      # bằng INFRA_BIND_ADDR (vd 0.0.0.0) — CÓ CHỦ ĐÍCH, không phải mặc định.
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mediaos} -d ${POSTGRES_DB:-mediaos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PgBouncer transaction-mode (ADR-0003): bắt buộc cho RLS — set_config('app.current_company_id',$1,true)
  # phải sống trong phạm vi transaction. App nghiệp vụ kết nối qua cổng 6432.
  # LISTEN/NOTIFY + BullMQ dùng pool DIRECT (postgres:5432), KHÔNG qua pgbouncer.
  #
  # 🔴 CHÍ MẠNG (G2-1): KHÔNG đặt DB_USER cố định. Nếu cố định = mọi server-conn chạy dưới 1 user
  # → RLS bị BYPASS → rò chéo tenant. Để TRỐNG DB_USER ⇒ PgBouncer GIỮ user client (mediaos_app)
  # suốt tới Postgres. auth_query (pgbouncer.get_auth, tạo ở migration 0001) lấy hash cho user bất kỳ.
  # userlist.txt (cho AUTH_USER=pgbouncer_auth) do scripts/setup-db-roles.mjs sinh ra — KHÔNG commit.
  # ⚠️ Cần `docker compose up` để kiểm chứng (auth_query pass-through chưa chạy thử trong môi trường này).
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: mediaos-pgbouncer
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-mediaos}
      # DB_USER cố tình BỎ TRỐNG → pass-through user (xem ghi chú chí mạng ở trên).
      # 🔧 FIX auth_query (S1 reconcile 2026-06-24): entrypoint edoburu dựng dòng [databases] là
      #    `auth_user=${DB_USER:-postgres}`. DB_USER trống ⇒ rơi về `auth_user=postgres` (role KHÔNG tồn
      #    tại — superuser của ta là `mediaos`) ⇒ pgbouncer login backend chạy auth_query THẤT BẠI
      #    ("password authentication failed for user postgres"). Đặt DATABASE_URL để DB_USER=pgbouncer_auth
      #    CHỈ nuôi `auth_user=` của database (generate_config_db_entry KHÔNG phát `user=` per-db) ⇒
      #    client→backend VẪN pass-through (mediaos_app) ⇒ RLS GIỮ NGUYÊN (đã verify current_user).
      #    Mật khẩu trong URL chỉ dùng nếu phải tự sinh userlist; ở đây userlist đã có pgbouncer_auth nên bỏ qua.
      #    S6-SEC-ROTATE-1: KHÔNG default mật khẩu. `${VAR:?msg}` làm `docker compose up` DỪNG khi thiếu
      #    biến — thà đỏ lúc khởi động còn hơn chạy bằng một chìa khoá ai cũng đọc được trong repo PUBLIC.
      DATABASE_URL: postgres://pgbouncer_auth:${PGBOUNCER_AUTH_PASSWORD:?thieu PGBOUNCER_AUTH_PASSWORD trong .env}@postgres:5432/${POSTGRES_DB:-mediaos}
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      AUTH_USER: pgbouncer_auth
      AUTH_QUERY: SELECT username, password FROM pgbouncer.get_auth($1)
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      # transaction-mode: server-side prepared statements không an toàn qua pool → tắt.
      # Drizzle/pg dùng simple/parametrized query nên OK.
      IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
    ports:
      # edoburu/pgbouncer lắng nghe container:5432 (docker logs: 'listening on 0.0.0.0:5432').
      # Host :6432 (đích DATABASE_URL/RLS) forward tới cổng PgBouncer thực nghe (container:5432).
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:5432"
    volumes:
      # userlist.txt chứa hash của pgbouncer_auth — sinh bởi setup-db-roles.mjs, đã gitignore.
      - ./.secrets/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    healthcheck:
      # Probe cổng container-internal PgBouncer (5432). PgBouncer + Postgres ở 2 container khác nhau
      # nên 127.0.0.1:5432 trong container này = chính PgBouncer, KHÔNG phải Postgres (DEVOPS-03 §16).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-mediaos} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine
    container_name: mediaos-valkey
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkeydata:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mediaos-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mediaos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${INFRA_BIND_ADDR:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  valkeydata:
  miniodata:
